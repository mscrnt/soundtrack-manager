name: Release

# Push a tag like v1.2.3 (matching soundtrack_manager/__version__) to publish:
#   ghcr.io/<owner>/soundtrack-manager:1.2.3, :1.2, :1, :latest  (linux/amd64 + linux/arm64)
# and a GitHub Release with generated notes. Pre-release tags (v1.2.3-rc.1) skip :latest.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Tag must match __version__
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          CODE="v$(python -c 'import soundtrack_manager as s; print(s.__version__)')"
          echo "tag=$TAG code=$CODE"
          [ "${TAG%%-*}" = "${CODE%%-*}" ] || { echo "::error::tag $TAG does not match __version__ $CODE"; exit 1; }

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Soundtrack Manager
            org.opencontainers.image.description=Discover, queue and download video game soundtracks from khinsider
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          VERSION="${TAG#v}"
          # This version's section of CHANGELOG.md ("## 0.2.0 — date" up to the next "## "), if there is one.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "See the commits below." > notes.md; fi
          {
            echo
            echo "## Updating"
            echo
            echo "If you run it with Docker Compose (recommended), from your soundtrack-manager folder:"
            echo
            echo '```sh'
            echo 'git pull                 # newest compose.yaml and .env.example'
            echo 'docker compose pull      # this release'
            echo 'docker compose up -d     # restart with it; the database upgrades itself'
            echo '```'
            echo
            echo "If you pinned a version with \`APP_VERSION\` in \`.env\`, set it to \`${VERSION}\` first."
            echo "New here? Follow the [quick start](https://github.com/${GITHUB_REPOSITORY}#quick-start-docker)."
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (stable releases are also \`:latest\`), for linux/amd64 and linux/arm64."
          } >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-file notes.md $PRE
          fi
