# Keeps the README's "downloads" badge current.
# GHCR has no API for a package's download count, so this reads "Total downloads" from the public
# package page and writes a shields.io endpoint file to the `badges` branch (kept out of main's history).
name: Badges

on:
  schedule:
    - cron: "17 6 * * *"        # daily
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Read the download count
        id: count
        env:
          PAGE: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
        run: |
          curl -fsSL "$PAGE" -o page.html
          COUNT=$(python3 - <<'EOF'
          import re
          html = open("page.html", encoding="utf-8").read()
          text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", html))
          m = re.search(r"Total downloads\s+([\d.,]+[kKmMbB]?)(?![A-Za-z])", text)
          print(m.group(1) if m else "")
          EOF
          )
          if [ -z "$COUNT" ]; then echo "::error::'Total downloads' not found on $PAGE"; exit 1; fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Total downloads: $COUNT"
      - name: Publish badge data
        env:
          COUNT: ${{ steps.count.outputs.count }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir badges && cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue","namedLogo":"docker","logoColor":"white"}\n' "$COUNT" > downloads.json
          printf 'Generated by .github/workflows/badges.yml. Do not edit.\n' > README.md
          git add -A && git commit -qm "Update badge data"
          git push -qf "$REPO_URL" badges   # one commit, replaced each run
